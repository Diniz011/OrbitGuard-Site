<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Eventos climáticos do OrbitGuard: ocorrências detectadas por satélite, incluindo incêndios, inundações, secas, tempestades e deslizamentos.">
  <meta name="author" content="Equipe OrbitGuard - FIAP">
  <meta name="theme-color" content="#0a0e1a">
  <title>Eventos Climáticos | OrbitGuard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="starfield"></div>
  <div class="grid-overlay"></div>

  <main class="page-main">
    <div class="container">
      <div class="page-head">
        <div class="head-row">
          <div>
            <p class="eyebrow">Histórico Ambiental</p>
            <h1>Eventos Climáticos</h1>
            <p>Ocorrências detectadas por satélite: incêndios, inundações, secas, tempestades e deslizamentos.</p>
          </div>
          <button class="btn btn-success admin-only" id="btnNovo">
            <span class="icon-text">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Registrar Evento
            </span>
          </button>
        </div>
      </div>

      <div class="filters">
        <div class="filter-group">
          <label>Tipo</label>
          <div class="chips" id="tipoChips">
            <span class="chip active" data-tipo="ALL">Todos</span>
            <span class="chip" data-tipo="INCENDIO"><span class="icon-text"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>Incêndio</span></span>
            <span class="chip" data-tipo="INUNDACAO"><span class="icon-text"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 1.3 0 1.9-.5 2.5-1"/><path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 1.3 0 1.9-.5 2.5-1"/><path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 1.3 0 1.9-.5 2.5-1"/></svg>Inundação</span></span>
            <span class="chip" data-tipo="SECA"><span class="icon-text"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/></svg>Seca</span></span>
            <span class="chip" data-tipo="TEMPESTADE"><span class="icon-text"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"/><polyline points="13 11 9 17 15 17 11 23"/></svg>Tempestade</span></span>
            <span class="chip" data-tipo="DESLIZAMENTO"><span class="icon-text"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3l4 8 5-5 5 15H2L8 3z"/></svg>Deslizamento</span></span>
          </div>
        </div>
        <div class="filter-group" style="flex:1; min-width:200px;">
          <label>Região</label>
          <select id="regiaoFilter"><option value="ALL">Todas as regiões</option></select>
        </div>
      </div>

      <div class="card-grid" id="eventoGrid"></div>
    </div>
  </main>

  <!-- Modal novo evento -->
  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <div class="modal-head">
        <h3><span class="icon-text">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Registrar Evento Climático</span></h3>
        <button class="modal-close" id="modalClose">×</button>
      </div>
      <form id="eventoForm">
        <div class="form-grid">
          <div class="field">
            <label for="f_regiao">Região</label>
            <select id="f_regiao" required></select>
          </div>
          <div class="field">
            <label for="f_tipo">Tipo</label>
            <select id="f_tipo" required>
              <option value="INCENDIO">Incêndio</option>
              <option value="INUNDACAO">Inundação</option>
              <option value="SECA">Seca</option>
              <option value="TEMPESTADE">Tempestade</option>
              <option value="DESLIZAMENTO">Deslizamento</option>
            </select>
          </div>
          <div class="field">
            <label for="f_nivel">Nível</label>
            <select id="f_nivel" required>
              <option value="ALTO">Alto</option>
              <option value="MEDIO">Médio</option>
              <option value="BAIXO">Baixo</option>
            </select>
          </div>
          <div class="field">
            <label for="f_data">Data</label>
            <input type="date" id="f_data" required>
          </div>
        </div>
        <div class="field" style="margin-top:1.1rem;">
          <label for="f_desc">Descrição</label>
          <textarea id="f_desc" rows="3" placeholder="Descreva o evento detectado..." required></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="modalCancel">Cancelar</button>
          <button type="submit" class="btn btn-success">Salvar Evento</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/eventos.js"></script>
</body>
</html>
